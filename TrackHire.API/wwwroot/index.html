<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackHire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTH SECTION -->
    <div id="auth-section" class="auth-container">
        <div class="auth-card">
            <h1>🎯 TrackHire</h1>
            <p class="subtitle">Track every job application in one place</p>
            <input type="text" id="name" placeholder="Full Name (register only)">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="register()">Register</button>
            <button class="secondary" onclick="login()">Login</button>
            <p id="auth-error" class="error"></p>
        </div>
    </div>

    <!-- APP SECTION -->
    <div id="app-section" style="display:none">
        <div class="topbar">
            <h2>🎯 TrackHire</h2>
            <div class="topbar-right">
                <span id="user-name"></span>
                <button class="small" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">

            <!-- Stats Row -->
            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-num" id="stat-total">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-card applied">
                    <span class="stat-num" id="stat-applied">0</span>
                    <span class="stat-label">Applied</span>
                </div>
                <div class="stat-card interview">
                    <span class="stat-num" id="stat-interview">0</span>
                    <span class="stat-label">Interview</span>
                </div>
                <div class="stat-card offer">
                    <span class="stat-num" id="stat-offer">0</span>
                    <span class="stat-label">Offer</span>
                </div>
                <div class="stat-card rejected">
                    <span class="stat-num" id="stat-rejected">0</span>
                    <span class="stat-label">Rejected</span>
                </div>
            </div>

            <!-- Add Application Form -->
            <div class="card">
                <h3>Add New Application</h3>
                <div class="form-grid">
                    <input type="text" id="company" placeholder="Company Name *">
                    <input type="text" id="jobTitle" placeholder="Job Title *">
                    <input type="text" id="location" placeholder="Location">
                    <input type="url" id="jobUrl" placeholder="Job URL">
                    <input type="number" id="salary" placeholder="Expected Salary (LPA)">
                    <input type="datetime-local" id="interviewDate">
                </div>
                <button onclick="addApplication()">+ Add Application</button>
                <p id="form-error" class="error"></p>
            </div>

            <!-- Filter + List -->
            <div class="card">
                <div class="list-header">
                    <h3>My Applications</h3>
                    <select id="statusFilter" onchange="loadApplications()">
                        <option value="">All Status</option>
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Offer">Offer</option>
                        <option value="Rejected">Rejected</option>
                        <option value="Withdrawn">Withdrawn</option>
                    </select>
                </div>
                <div id="applications-list"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
